[project]
name = "content-authority-pipeline"
version = "0.1.0"
description = "Pipeline LangGraph: link -> entrevista -> artigo de autoridade -> carrossel + legenda"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "André Felipe Cunha" }]
dependencies = [
    "httpx>=0.28,<1",
    "langchain>=1.4,<2",
    "langchain-openai>=1.7,<2",
    "langgraph>=1.2,<2",
    "langsmith>=0.14,<1",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.15,<3",
    "python-dotenv>=1.2,<2",
    "tavily-python>=0.8,<1",
    "trafilatura>=2.3,<3",
    "typer>=0.27,<1",
]

[project.scripts]
content-pipeline = "content_pipeline.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/content_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: chama APIs reais (requer chaves no .env)"]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 100
extend-exclude = ["docs"]  # os .md de docs/ têm esboços de código, não código executável

[dependency-groups]
dev = [
    "pytest>=9.1,<10",
    "ruff>=0.17,<1",
]
